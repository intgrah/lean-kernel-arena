name: Measure
description: Run a built checker over the exports and append a fragment to the results store

inputs:
  checker:
    required: true
  revision:
    required: true
  work:
    required: true
  run:
    required: true
  declines:
    default: ''
  source-url:
    default: ''
  tests:
    default: ''
  record:
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install perf and assert it counts instructions
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-generic
        perf stat -j -o probe.json -e instructions -- true
        jq -se 'map(."counter-value" | tonumber?) | length > 0' probe.json
        rm probe.json

    - name: Checkout results
      uses: actions/checkout@v4
      with:
        ref: results
        path: _results

    - name: Download exports
      uses: actions/download-artifact@v4
      with:
        name: exports
        path: _build/tests

    - name: Run
      shell: bash
      env:
        CHECKER: ${{ inputs.checker }}
        REVISION: ${{ inputs.revision }}
        WORK: ${{ inputs.work }}
        RUN: ${{ inputs.run }}
        DECLINES: ${{ inputs.declines }}
        SOURCE_URL: ${{ inputs.source-url }}
        TESTS: ${{ inputs.tests }}
        ARENA_RUNNER: github-${{ runner.os }}
        ARENA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        STORE: _results
        OUT: _fragments
      run: ./scripts/run-checker

    - name: Upload fragment
      if: inputs.record == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: fragment-${{ inputs.checker }}
        path: _fragments
        if-no-files-found: ignore
        retention-days: 1
