name: Measure
description: Run a built checker over the exports and append a fragment to the results store

inputs:
  checker:
    required: true
  revision:
    required: true
  work:
    required: true
  run:
    required: true
  declines:
    default: ''
  source-url:
    default: ''
  tests:
    default: ''
  record:
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install perf
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-generic
        sudo sysctl -w kernel.perf_event_paranoid=1

    - name: Checkout results
      uses: actions/checkout@v4
      with:
        ref: results
        path: _results

    - name: Download exports
      uses: actions/download-artifact@v4
      with:
        name: exports
        path: _build/tests

    - name: Run
      shell: bash
      env:
        CHECKER: ${{ inputs.checker }}
        REVISION: ${{ inputs.revision }}
        WORK: ${{ inputs.work }}
        RUN: ${{ inputs.run }}
        DECLINES: ${{ inputs.declines }}
        SOURCE_URL: ${{ inputs.source-url }}
        TESTS: ${{ inputs.tests }}
        ARENA_RUNNER: github-${{ runner.os }}
        ARENA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      run: ./scripts/run-checker

    - name: Push fragment
      if: inputs.record == 'true'
      shell: bash
      working-directory: _results
      env:
        CHECKER: ${{ inputs.checker }}
        REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --cached --quiet && exit 0
        git commit --quiet -m "$CHECKER" -m "Run: ${GITHUB_RUN_ID}"
        git push origin HEAD:results
