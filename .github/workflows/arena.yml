name: Arena run

on:
  workflow_call:
    inputs:
      skip-ci:
        description: Skip tests marked skip_on_ci
        type: boolean
        default: false
      record:
        description: Append the results to the store branch
        type: boolean
        default: false
      publish:
        description: Deploy the site to GitHub Pages
        type: boolean
        default: false
      checker:
        description: Checker to run; all of them when blank
        type: string
        default: ''
      pin:
        description: Pin to run instead of the configured one
        type: string
        default: ''
      force:
        description: Rerun pairs that already have a result
        type: boolean
        default: false

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        if: inputs.publish
        uses: actions/configure-pages@v4

      - name: Check out the results store
        uses: actions/checkout@v4
        with:
          ref: results
          path: _results

      - name: Allow unprivileged instruction counting
        run: sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Reuse the exports built by earlier runs
        uses: actions/cache@v4
        with:
          path: _build/tests
          key: exports-${{ runner.os }}-${{ github.sha }}
          restore-keys: exports-${{ runner.os }}-

      - name: Build the tests whose inputs changed
        env:
          SKIP_CI: ${{ inputs.skip-ci }}
        run: lake exe lka build-test $([ "$SKIP_CI" = true ] && echo --skip-ci)
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Run the pairs that have no result yet
        env:
          CHECKER: ${{ inputs.checker }}
          PIN: ${{ inputs.pin }}
          FORCE: ${{ inputs.force }}
          ARENA_RUNNER: github-${{ runner.os }}
        run: |
          lake exe lka run \
            ${CHECKER:+--checker "$CHECKER"} \
            ${PIN:+--pin "$PIN"} \
            $([ "$FORCE" = true ] && echo --force)
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Append to the results store
        if: inputs.record
        working-directory: _results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new results."
            exit 0
          fi
          git commit -m "results: run ${GITHUB_RUN_ID}" -m "Dispatched-by: ${GITHUB_ACTOR}"
          git push origin HEAD:results

      - name: Build the site
        run: lake exe lka build-site
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Upload the site
        if: inputs.publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_out'

      - name: Deploy to GitHub Pages
        if: inputs.publish
        id: deployment
        uses: actions/deploy-pages@v4
