name: Site

on:
  push:
    branches: [results]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - uses: actions/configure-pages@v4

      - name: Checkout results
        uses: actions/checkout@v4
        with:
          ref: results
          path: _results

      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/tests
            _build/tarball.json
            _build/lean-arena-tests.tar.gz
            site-data/sources
            site-data/exports
          key: corpus-${{ hashFiles('Tests/**', 'lean-toolchain', 'lakefile.lean') }}
          fail-on-cache-miss: true

      - name: Assemble the payload
        run: lake exe lka site-data

      - name: Render the site
        run: |
          lake exe arena-site --output _out
          cp _build/lean-arena-tests.tar.gz _out/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_out"

      - id: deployment
        uses: actions/deploy-pages@v4
