name: Site

on:
  push:
    branches: [results]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v4

      - name: Checkout results
        uses: actions/checkout@v4
        with:
          ref: results
          path: _results

      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: |
            _build/tests
            _build/tarball.json
            _build/lean-arena-tests.tar.gz
            site-data/sources
            site-data/exports
          key: corpus-${{ hashFiles('Tests/**', 'lean-toolchain', 'lakefile.lean') }}
          fail-on-cache-miss: true

      - name: Assemble the payload
        run: lake exe lka site-data
        shell: "nix develop -c bash -euxo pipefail {0}"

      - name: Render the site
        run: |
          lake exe arena-site --output _out
          cp _build/lean-arena-tests.tar.gz _out/
        shell: "nix develop -c bash -euxo pipefail {0}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "_out"

      - id: deployment
        uses: actions/deploy-pages@v4
