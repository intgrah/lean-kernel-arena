name: Measure

on:
  workflow_dispatch:
    inputs:
      tests:
        description: Test name or directory; blank for all but the large ones
        type: string
  pull_request:
  push:
    branches: [master]

concurrency:
  group: measure-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  exports:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          use-github-cache: false

      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - uses: actions/cache@v4
        with:
          path: |
            _build/tests
            _build/tarball.json
            _build/lean-arena-tests.tar.gz
            site-data/sources
            site-data/exports
          key: corpus-${{ hashFiles('Tests/**', 'lean-toolchain', 'lakefile.lean') }}

      - name: Build tests
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          if [ -n "$TESTS" ]; then
            lake exe lka build-test "$TESTS"
          else
            lake exe lka build-test --skip-ci
          fi

      - name: Prepare the corpus products the site needs
        run: lake exe lka prepare

      - name: Smoke-test the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-generic
          CHECKER=smoke REVISION=none WORK=. RUN=true \
            TESTS="$(jq -r .name "$(find _build/tests -name '*.stats.json' | head -1)")" \
            STORE=_smoke OUT=_smoke ./scripts/run-checker
          jq -e '.entries | length == 1' _smoke/smoke/none/*.json

      - uses: actions/upload-artifact@v4
        with:
          name: exports
          path: _build/tests
          retention-days: 1

  evmlean:
    needs: exports
    uses: ./.github/workflows/checker-evmlean.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  lean4lean:
    needs: exports
    uses: ./.github/workflows/checker-lean4lean.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  mini:
    needs: exports
    uses: ./.github/workflows/checker-mini.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  nanobruijn:
    needs: exports
    uses: ./.github/workflows/checker-nanobruijn.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  nanoda:
    needs: exports
    uses: ./.github/workflows/checker-nanoda.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  nyaya:
    needs: exports
    uses: ./.github/workflows/checker-nyaya.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  official:
    needs: exports
    uses: ./.github/workflows/checker-official.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  parse-only:
    needs: exports
    uses: ./.github/workflows/checker-parse-only.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  rpylean:
    needs: exports
    uses: ./.github/workflows/checker-rpylean.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  sokonanoda:
    needs: exports
    uses: ./.github/workflows/checker-sokonanoda.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  still-nanoda:
    needs: exports
    uses: ./.github/workflows/checker-still-nanoda.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  vow-lean-kernel:
    needs: exports
    uses: ./.github/workflows/checker-vow-lean-kernel.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  zignodamus:
    needs: exports
    uses: ./.github/workflows/checker-zignodamus.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }

  collect:
    needs:
      [
        evmlean,
        lean4lean,
        mini,
        nanobruijn,
        nanoda,
        nyaya,
        official,
        parse-only,
        rpylean,
        sokonanoda,
        still-nanoda,
        vow-lean-kernel,
        zignodamus,
      ]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: results
      - uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          merge-multiple: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Run: ${GITHUB_RUN_ID}"
          git push origin HEAD:results
