name: Measure

on:
  workflow_dispatch:
    inputs:
      tests:
        description: Test name or directory; blank for all but the large ones
        type: string
  pull_request:
  push:
    branches: [master]

concurrency:
  group: measure-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  exports:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build tests
        env:
          TESTS: ${{ inputs.tests }}
        run: lake exe lka build-test ${TESTS:---skip-ci} ${TESTS:+"$TESTS"}
        shell: "nix develop -c bash -euxo pipefail {0}"
      - uses: actions/upload-artifact@v4
        with:
          name: exports
          path: _build/tests
          retention-days: 1

  evmlean:
    needs: exports
    uses: ./.github/workflows/checker-evmlean.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  lean4lean:
    needs: exports
    uses: ./.github/workflows/checker-lean4lean.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  mini:
    needs: exports
    uses: ./.github/workflows/checker-mini.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  nanobruijn:
    needs: exports
    uses: ./.github/workflows/checker-nanobruijn.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  nanoda:
    needs: exports
    uses: ./.github/workflows/checker-nanoda.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  nyaya:
    needs: exports
    uses: ./.github/workflows/checker-nyaya.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  official:
    needs: exports
    uses: ./.github/workflows/checker-official.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  parse-only:
    needs: exports
    uses: ./.github/workflows/checker-parse-only.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  rpylean:
    needs: exports
    uses: ./.github/workflows/checker-rpylean.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  sokonanoda:
    needs: exports
    uses: ./.github/workflows/checker-sokonanoda.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  still-nanoda:
    needs: exports
    uses: ./.github/workflows/checker-still-nanoda.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  vow-lean-kernel:
    needs: exports
    uses: ./.github/workflows/checker-vow-lean-kernel.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }
  zignodamus:
    needs: exports
    uses: ./.github/workflows/checker-zignodamus.yaml
    with:
      {
        tests: "${{ inputs.tests }}",
        record: "${{ github.event_name != 'pull_request' }}",
      }

  collect:
    needs:
      [
        evmlean,
        lean4lean,
        mini,
        nanobruijn,
        nanoda,
        nyaya,
        official,
        parse-only,
        rpylean,
        sokonanoda,
        still-nanoda,
        vow-lean-kernel,
        zignodamus,
      ]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: results
      - uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          merge-multiple: true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Run: ${GITHUB_RUN_ID}"
          git push origin HEAD:results
