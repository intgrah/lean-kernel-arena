name: Build and Deploy Site

on:
  workflow_dispatch:
    inputs:
      checker:
        type: string
      pin:
        description: Toolchain or commit
        type: string
      rerun:
        type: boolean
        default: false
      publish:
        type: boolean
        default: true
  pull_request:

concurrency:
  group: arena-results
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/arena.yml
    permissions:
      contents: read

  measure:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/arena.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    with:
      record: true
      publish: ${{ inputs.publish }}
      checker: ${{ inputs.checker }}
      pin: ${{ inputs.pin }}
      rerun: ${{ inputs.rerun }}
