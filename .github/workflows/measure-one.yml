name: Measure one checker

on:
  workflow_call:
    inputs:
      checker:
        type: string
        required: true
      tests:
        type: string
        default: ''
      pin:
        type: string
        default: ''
      rerun:
        type: boolean
        default: false
      record:
        type: boolean
        default: false

jobs:
  measure:
    name: ${{ inputs.checker }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout results
        uses: actions/checkout@v4
        with:
          ref: results
          path: _results

      - name: Set perf_event_paranoid
        run: sudo sysctl -w kernel.perf_event_paranoid=1

      - name: Restore exports
        uses: actions/cache/restore@v4
        with:
          path: _build/tests
          key: exports-${{ inputs.tests || 'small' }}-
          restore-keys: exports-${{ inputs.tests || 'small' }}-

      - name: Build tests
        env:
          TESTS: ${{ inputs.tests }}
        run: lake exe lka build-test ${TESTS:---skip-ci} ${TESTS:+"$TESTS"}
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Run
        env:
          CHECKER: ${{ inputs.checker }}
          TESTS: ${{ inputs.tests }}
          PIN: ${{ inputs.pin }}
          RERUN: ${{ inputs.rerun }}
          ARENA_RUNNER: github-${{ runner.os }}
        run: |
          lake exe lka run --checker "$CHECKER" \
            ${TESTS:+--test "$TESTS"} \
            ${PIN:+--pin "$PIN"} \
            $([ "$RERUN" = true ] && echo --rerun)
        shell: 'nix develop -c bash -euxo pipefail {0}'

      - name: Push results
        if: inputs.record
        working-directory: _results
        env:
          CHECKER: ${{ inputs.checker }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "$CHECKER" -m "Run: ${GITHUB_RUN_ID}" -m "Dispatched-by: ${GITHUB_ACTOR}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin results && git push origin HEAD:results && exit 0
            sleep $((attempt * 5))
          done
          exit 1
